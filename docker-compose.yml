# One box, all sites. Add a site = one service here + one block in Caddyfile.
services:
  inaa:
    build: .
    restart: unless-stopped
    env_file: .env
    expose: ["3000"]
    networks: [web]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]

networks:
  web: {}
volumes:
  caddy_data: {}
  caddy_config: {}
