# One box, all sites. Add a site = one service here + one block in Caddyfile.
services:
  inaa:
    build: .
    image: inaa-app:latest
    restart: unless-stopped
    env_file: .env
    expose: ["3000"]
    networks: [web]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]

networks:
  web: {}
volumes:
  caddy_data: {}
  caddy_config: {}
