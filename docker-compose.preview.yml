# Branch preview at http://152.53.194.188:8080 — pushed via ./preview.sh from the laptop.
# Isolated compose project (-p inaa-preview); shares the box .env with production.
services:
  preview:
    build: .
    image: inaa-preview:latest
    restart: unless-stopped
    env_file: .env
    ports: ["8080:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
